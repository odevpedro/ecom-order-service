server:
  port: ${PORT:3003}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecom_order}
    username: ${DATABASE_USER:ecom}
    password: ${DATABASE_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

rabbitmq:
  enabled: ${RABBITMQ_ENABLED:true}

services:
  cart: ${CART_SERVICE_URL:http://localhost:3002}
  product-catalog: ${PRODUCT_CATALOG_URL:http://localhost:3001}
  user: ${USER_SERVICE_URL:http://localhost:3007}
  payment: ${PAYMENT_SERVICE_URL:http://localhost:3004}
  shipping: ${SHIPPING_SERVICE_URL:http://localhost:3005}
  invoice: ${INVOICE_SERVICE_URL:http://localhost:3006}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      product:
        base-config: default
      user:
        base-config: default
      shipping:
        base-config: default
      payment:
        base-config: default
      invoice:
        base-config: default
