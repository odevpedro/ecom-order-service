server:
  port: ${PORT:3003}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecom_order}
    username: ${DATABASE_USER:ecom}
    password: ${DATABASE_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  cart: ${CART_SERVICE_URL:http://localhost:3002}
  product-catalog: ${PRODUCT_CATALOG_URL:http://localhost:3001}
  user: ${USER_SERVICE_URL:http://localhost:3007}
  payment: ${PAYMENT_SERVICE_URL:http://localhost:3004}
  shipping: ${SHIPPING_SERVICE_URL:http://localhost:3005}
  invoice: ${INVOICE_SERVICE_URL:http://localhost:3006}
